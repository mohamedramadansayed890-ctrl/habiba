<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اللي بنا انتهى</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        button {
            padding: 16px 40px;
            font-size: 22px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); }
        #msg {
            margin-top: 40px;
            font-size: 28px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <button onclick="showMsg()">اضغط هنا</button>
    <div id="msg">اللي بنا انتهى اشوف وشك علي خير سلام</div>
    <script>
        function showMsg() {
            document.getElementById('msg').style.display = 'block';
        }
    </script>
</body>
</html>
